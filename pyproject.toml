[tool.poetry]
name = "payment-processing"
version = "0.1.0"
description = "Asynchronous payment processing service"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncpg"], version = "^2.0.29"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
faststream = {extras = ["rabbit"], version = "^0.5.0"}
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
psycopg2-binary = "^2.9.9" # Alembic needs a sync driver for migrations
structlog = "^24.1.0"
tenacity = "^9.1.4"
aiosqlite = "^0.22.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
sqlalchemy-utils = "^0.41.1"
pytest-httpx = "^0.30.0"
ruff = "^0.4.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.main.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"